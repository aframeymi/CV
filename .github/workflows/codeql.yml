# CodeQL code scanning: looks for vulnerabilities such as injection or path traversal by following how
# data flows through the code. Results appear under Security > Code scanning on GitHub.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Every Monday, so new CodeQL queries also check code that has not changed
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to upload the results to GitHub's code scanning
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          # Adds the security-extended queries to the default ones
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
