# Dependabot opens a pull request when a dependency or a GitHub Action has a newer version.
# Each pull request runs the CI checks, so an update that breaks something cannot be merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait two weeks after a release, so a compromised or broken version is usually caught by others first.
    # Security updates are not delayed by this.
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    # A package goes into the first group that matches it, so the groups of packages that only work
    # in matching versions come first. Their updates, major ones included, arrive in one pull request.
    groups:
      # The Prisma CLI and client must have the same version. Updated alone, the client stops the app
      # at startup, which the tests cannot see because they replace the database with a fake.
      prisma:
        patterns: ['prisma', '@prisma/*']
      # Jest runs the tests through babel-jest and Babel, which must match each other's major versions
      test-tooling:
        patterns: ['jest', '@types/jest', 'babel-jest', '@babel/*']
      # Small updates of other development tools arrive together, to keep the number of pull requests low
      development-tools:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
